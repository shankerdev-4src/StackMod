<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Library</title>
<style>
  :root { --ink:#1d2a2f; --paper:#f5f7f6; --line:#d3dcda; --accent:#1f6f6b; --warn:#b3261e; --ok:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:var(--paper); color:var(--ink); line-height:1.5; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:var(--ink); color:#fff; }
  header b { font-size:1.2rem; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  h2 { margin-top:0; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; padding:6px 14px; border-radius:4px; cursor:pointer; }
  button:hover { filter:brightness(1.1); } button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:inherit; border:1px solid currentColor; }
  button.danger { background:var(--warn); }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .scroll { overflow-x:auto; }
  .box { background:#fff; border:1px solid var(--line); padding:16px; border-radius:6px; margin-bottom:16px; }
  .err { color:var(--warn); margin:8px 0; } .ok { color:var(--ok); margin:8px 0; } .muted { color:#66757a; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:.85rem; border:1px solid var(--line); }
  .tag.bad { color:var(--warn); border-color:var(--warn); } .tag.good { color:var(--ok); border-color:var(--ok); }
  .narrow { max-width:380px; margin:48px auto; }
  .narrow input { width:100%; margin-bottom:10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
